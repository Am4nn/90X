[project]
name = "pipeline"
version = "0.1.0"
description = "90X data pipeline: download, normalize, enrich, generate cards"
readme = "README.md"
authors = [
    { name = "Aman Arya", email = "125aryaaman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
