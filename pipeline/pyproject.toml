[project]
name = "pipeline"
version = "0.1.0"
description = "90X data pipeline: download, normalize, enrich, generate cards"
readme = "README.md"
authors = [
    { name = "Aman Arya", email = "125aryaaman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "markdownify>=1.2.3",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
